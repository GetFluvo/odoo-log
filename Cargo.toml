[workspace]
resolver = "3"
members = ["crates/odoo-log"]
# chipmunk-odoo targets wasm32-wasip2 and has its own workspace (see its README).
exclude = ["crates/chipmunk-odoo"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/GetFluvo/odoo-log"
